[project]
name = "wh-failed-asset-triage"
version = "0.1.0"
description = "Triage engine for clinical-stage women's health assets that stopped for non-biological reasons."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "duckdb>=1.1",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
wh-ingest = "src.ingest.run:main"
wh-extract = "src.extract.run:main"
wh-enrich = "src.enrich.run:main"
wh-classify = "src.classify.run:main"
wh-score = "src.score.run:main"
wh-serve-export = "src.serve.export:main"
wh-eval = "src.eval.run:main"
wh-rights = "src.rights.fill:main"
wh-rights-writeback = "src.rights.writeback:main"
wh-ctis-score = "src.score.ctis:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
