name: CI

on:
  push:
  pull_request:

jobs:
  eval-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest
      - name: Eval harness
        run: python -m src.eval.run
      - name: Eval selftest
        run: python -m src.eval.selftest
