name: CI

# Stop email storms from incremental pushes to main.
# Run on PRs and manual dispatch; main push still allowed but cancels superseded runs.
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest
      - name: Eval harness
        run: python -m src.eval.run
      - name: Eval selftest
        run: python -m src.eval.selftest
