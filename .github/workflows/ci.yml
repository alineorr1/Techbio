name: CI

# Primary: PRs + manual runs. Bulk `push` was the Gmail storm.
# A narrow push remains only so edits to this file on main are still exercised.
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  eval-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest
      - name: Eval harness
        run: python -m src.eval.run
      - name: Eval selftest
        run: python -m src.eval.selftest
