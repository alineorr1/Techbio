name: CI

# Email storm mitigation: do NOT run on every push while golden labels / corpus
# are being restored. Re-enable `push` to main after HEAD is green via workflow_dispatch.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest
      - name: Eval harness
        run: python -m src.eval.run
      - name: Eval selftest
        run: python -m src.eval.selftest
